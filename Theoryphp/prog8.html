<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
  $("#fadein").click(function(){
    $("#div1").fadeIn();;
    $("#div2").fadeIn("slow", .5,function(){alert("div2 fadeIn");});
    $("#div3").fadeIn(3000);
    
  });
  $("#fadeout").click(function(){
    $("#div1").fadeOut(function(){alert("div1 fadeIn");});
    $("#div2").fadeOut("slow",function(){alert("div2 fadeIn");});
    $("#div3").fadeOut(3000,function(){alert("div3 fadeIn");});
    
  });
 
 
});
</script>
</head>
<body>

<p>Demonstrate fadeIn() with different parameters.</p>

<button id="fadein">Click to fade in boxes</button><br><br>
<button id="fadeout">Click to fade out boxes</button><br><br>

<div id="div1" style="width:80px;height:80px;display:block;background-color:red;"></div><br>
<div id="div2" style="width:80px;height:80px;display:block;background-color:green;"></div><br>
<div id="div3" style="width:80px;height:80px;display:block;background-color:blue;"></div>

</body>
</html>
