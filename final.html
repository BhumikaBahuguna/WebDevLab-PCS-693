<!DOCTYPE html>
<html>
<head>
<title>Workshop Registration Form</title>
<style>
label {
    font-weight: bold;
    font-size: 17px;
}
input:valid {
    border: 2px solid green;
    background-color: #d4edda;
}
input:invalid {
    border: 2px solid red;
    background-color: #f8d7da;
}

input, select {
    width: 90%;
    padding: 8px;
    margin-top: 5px;
    font-size: 14px;
}
input[type="radio"] {
    width: auto;
    margin-right: 5px;
}
input[type="submit"]:hover {
    background-color: green;
    color: white;
    cursor: pointer;
}
input[type="reset"]:hover {
    background-color: red;
    color: white;
    cursor: pointer;
}
input[type="submit"],input[type="reset"] {
    background-color: #f0f0f0;
    border: 1px solid #999;
    width: 45%;
    display: inline-block;
}
</style>
</head>

<body bgcolor="#80ECFF">

<center>
<img src="geulogo.png" width="130" height="130"><br><br>
</center>

<marquee direction="right">
<font color="#002938" size="4">
<b>Graphic Era Deemed to be University, Dehradun, Uttarakhand. Workshop Registrations are open from 25 January 2026 to 15 February 2026.</b>
</font>
</marquee>
<br>

<form action="submit.html" method="GET">

<fieldset style="width: 30%; margin: auto; border: 2px solid #00445d; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">

<h1 style="text-align:center;">
<font size="6" color="#00445d">Workshop Registration Form</font>
</h1>

<label for="stname">Student Name</label><br>
<input type="text" id="stname" name="stname" pattern="[A-Za-z ]{3,30}" required>
<br><br>

<label for="email">University Email ID</label><br>
<input type="email" id="email" name="email" required>
<br><br>

<label for="password">Password</label><br>
<input type="password" id="password" name="password" minlength="6" maxlength="12" required>
<br><br>

<label for="course">Workshop</label><br>
<select id="course" name="course">
<option>Introduction to C and C++</option>
<option>Data Structures</option>
<option>DBMS</option>
<option>Operating Systems</option>
<option>Web Technologies</option>
</select>
<br><br>

<label for="age">Age</label><br>
<input type="number" id="age" name="age" min="18" max="30" required>
<br><br>

<label for="gender">Gender</label><br>
<input type="radio" name="gender" value="male">Male
<input type="radio" name="gender" value="female">Female
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</fieldset>
</form>

</body>
</html>
