<!-- 
1 <background-color>
    The background-color property in CSS is used to set the background color of an HTML element. It can be applied to various elements such as divs, paragraphs, headings, and the body of the webpage.
2 <background-image>
    The background-image property in CSS is used to set an image as the background of an HTML element. This image can be applied to various elements such as divs, paragraphs, headings, and the body of the webpage.
3 <background-repeat>
    The background-repeat property in CSS is used to control how a background image is repeated (tiled) within an HTML element. It can be applied to various elements such as divs, paragraphs, headings, and the body of the webpage.
4 <background-size>
    The background-size property in CSS is used to specify the size of a background image within an
    HTML element. It can be applied to various elements such as divs, paragraphs, headings, and the body of the webpage.
5 <background-position>
    The background-position property in CSS is used to specify the initial position of a background image within
    an HTML element. It can be applied to various elements such as divs, paragraphs, headings, and the body of the webpage.
-->
<html>
    <head>
        <style>
            body {
                background-color: lightblue;
            }
            .background-image {
                background-image: url('https://www.example.com/image.jpg');
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                height: 400px;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <h1>Background Properties in CSS</h1>
        <div class="background-image">
            <h2>This div has a background image</h2>
        </div>
    </body>
