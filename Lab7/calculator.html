<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
<style>
body{
    background-image: url("back.png");
    background-size: cover;      /* makes image fit entire screen */
    background-position: center; /* keeps it centered */
    background-repeat: no-repeat;
    align-items:center;
    display:flex;
    justify-content:center;
}
/* Calculator Box */
.calculator{
    width:400px;
    padding:40px;
    border:5px solid black;   /* Thick Border */
    background:#f9fbff;
    text-align:center;
}
/* Heading inside border */
.calculator h1{
    margin-bottom:15px;
}
/* Display */
input{
    width:100%;
    height:45px;
    font-size:20px;
    margin-bottom:15px;
    border:2px solid black;
}
/* Grid Layout */
.buttons{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
}
/* Buttons */
button{
    height:50px;
    border:2px solid black;
    font-size:16px;
    cursor:pointer;
}
/* Number buttons */
.num{
    background:#cfe2ff;
}
/* Operation buttons */
.op{
    background:#ffe0b3;
}
/* Equal button */
.equal{
    background:#baffc9;
}
/* Clear button */
.clear{
    background:#ffb3b3;
}
/* Hover effects */
.equal:hover,
.clear:hover{
    background:black;
    color:white;
}
/* Empty cells */
.empty{
    visibility:hidden;
}
</style>
</head>
<body>
<div class="calculator">
<h1>Simple Calculator</h1>
<input type="text" id="display" readonly>
<div class="buttons">
<button class="num" onclick="press('1')">1</button>
<button class="num" onclick="press('2')">2</button>
<button class="num" onclick="press('3')">3</button>
<button class="num" onclick="press('4')">4</button>
<button class="num" onclick="press('5')">5</button>
<button class="num" onclick="press('6')">6</button>
<button class="num" onclick="press('7')">7</button>
<button class="num" onclick="press('8')">8</button>
<button class="num" onclick="press('9')">9</button>
<button class="num" onclick="press('0')">0</button>
<button class="empty"></button>
<button class="empty"></button>
<button class="op" onclick="press('+')">+</button>
<button class="op" onclick="press('-')">-</button>
<button class="op" onclick="press('*')">*</button>
<button class="op" onclick="press('/')">/</button>
<button class="op" onclick="press('%')">%</button>
<button class="op" onclick="press('**')">^</button>
<button class="equal" onclick="calculate()">=</button>
<button class="clear" onclick="clearDisplay()">C</button>
<button class="empty"></button>
</div>
</div>
<script>
function press(val){
    document.getElementById("display").value += val;
}
function calculate(){
    try{
        document.getElementById("display").value =
        eval(document.getElementById("display").value);
    }
    catch{
        alert("Invalid Expression");
    }
}
function clearDisplay(){
    document.getElementById("display").value="";
}
</script>
</body>
</html>
