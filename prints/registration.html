<!DOCTYPE html>
<html>
<head>
    <title>Student Course Registration</title>
</head>

<body bgcolor="#EAF4FF">

<h2 align="center">
    <b>GRAPHIC ERA DEEMED TO BE UNIVERSITY</b><br>
    <b>Student Course Registration Form</b>
</h2>

<center>
    <img src="logo.png" alt="College Logo" height="110">
</center>

<marquee>
    <font color="blue" size="4">
        Graphic Era Deemed to be University, Dehradun
    </font>
</marquee>

<br><br>

<center>
<form action="thankyou.html" method="get" autocomplete="off" target="_blank"
      style="background-color:#DCEEFF; width:420px; padding:25px; border-radius:15px;">

<table cellpadding="8" cellspacing="0">

<tr>
<td><b>Student Name:</b></td>
<td><input type="text" id="name" name="name" required minlength="3" maxlength="30"></td>
</tr>

<tr>
<td><b>University Email:</b></td>
<td>
<input type="email" id="email" name="email"
required pattern="[0-9]+@geu\.ac\.in"
</td>
</tr>

<tr>
<td><b>USN / Roll Number:</b></td>
<td>
<input type="text" id="roll" name="roll" required pattern="[A-Z]{2}[0-9]{2}[A-Z]{3}">
</td>
</tr>

<tr>
<td><b>Age:</b></td>
<td>
<input type="number" id="age" name="age" required min="18" max="30">
</td>
</tr>

<tr>
<td><b>Gender:</b></td>
<td>
<input type="radio" id="male" name="gender" required>
<label for="male">Male</label>
&nbsp;&nbsp;
<input type="radio" id="female" name="gender">
<label for="female">Female</label>
</td>
</tr>

<tr>
<td><b>Select Course:</b></td>
<td>
<select id="course" name="course" required>
    <option value="" selected disabled>--Select--</option>
    <option value="C Programming">C Programming</option>
    <option value="C++ Programming">C++ Programming</option>
    <option value="Data Structures">Data Structures</option>
    <option value="Web Development">Web Development</option>
</select>
</td>
</tr>

<tr>
<td><b>Feedback:</b></td>
<td>
<textarea id="feedback" name="feedback" rows="3" cols="22"></textarea>
</td>
</tr>

<tr>
<td><b>Comments:</b></td>
<td>
<textarea id="comments" name="comments" rows="3" cols="22"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<br>
<input type="submit" value="Submit">
&nbsp;&nbsp;
<input type="reset" value="Reset">
</td>
</tr>

</table>

<input type="hidden" name="college" value="Graphic Era University">

</form>
</center>

</body>
</html>
