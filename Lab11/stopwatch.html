<!DOCTYPE html>
<html>
<head>
<title>Stopwatch Seconds</title>

<style>
body{
  background:#f8fafc;
  font-family:Segoe UI;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh; /* FIXED */
  margin:0;
}

.box{
  background:#c2bebe;
  padding:40px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  text-align:center;
  width:550px;
  height:350px;
}

h1{
  color:#1f42e2;
  letter-spacing:2px;
  margin-bottom:25px;
  font-size:60px;
}

#time{
  font-size:60px;
  font-style:italic;
  color:#5a5a5a;
  background:#f3f6fb;
  padding:18px;
  border-radius:15px;
  margin-bottom:30px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  margin:6px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  font-size:32px;
}

.start{
  background:#d4f5e9;
  color:#147a63;
}

.start:hover{
  background:#baf0df;
}

.pause{
  background:#fff6d6;
  color:#b38b00;
}

.pause:hover{
  background:#ffeaa7;
}

.reset{
  background:#ffe3e3;
  color:#b03030;
}

.reset:hover{
  background:#ffcaca;
}
</style>
</head>

<body>

<div class="box">
  <h1>STOPWATCH</h1>

  <div id="time">
    0
  </div>

  <button class="start" onclick="start()">START</button>
  <button class="pause" onclick="pause()">PAUSE</button>
  <button class="reset" onclick="reset()">RESET</button>
</div>

<script>
let seconds = 0;
let interval = null;

function start(){
  if(interval !== null){
    clearInterval(interval);
  }
  interval = setInterval(run, 1000);
}

function run(){
  seconds++;
  document.getElementById("time").innerHTML = seconds;
}

function pause(){
  clearInterval(interval);
}

function reset(){
  clearInterval(interval);
  seconds = 0;
  document.getElementById("time").innerHTML = "0";
}
</script>

</body>
</html>
