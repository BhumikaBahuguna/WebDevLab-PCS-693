<!DOCTYPE html>
<html>
    <head>
        <title>Online Job Application Form</title>
        <style>
        label {
            font-weight: bold;
            font-size: 17px;
        }
        input, select {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            font-size: 14px;
        }
        input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
        input:valid {
            border: 2px solid green;
            background-color: #d4edda; /* light green */
        }
        input:invalid {
            border: 2px solid red;
            background-color: #f8d7da; /* light red */
        }
        input[type="submit"]:hover {
            background-color: green;
            color: white;
            cursor: pointer;
        }
        input[type="reset"]:hover {
            background-color: red;
            color: white;
            cursor: pointer;
        }
        input[type="submit"],input[type="reset"] {
            background-color: #f0f0f0;
            border: 1px solid #999;
            width: 45%;
            display: inline-block;
        }
        </style>
    </head>
    <body bgcolor="#ffe7b0">
        <form action="submit.html" method="GET">
            <fieldset style="width: 30%; margin:auto; border: 2px solid #6f561b; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                <h1 style="text-align:center;"><font size="6" color="#6f561b"><b>Job Application Form</b></font></h1><br>
                <label for="name">Applicant Full Name</label><br>
                <input type="text" id="name" name="name" minlength=4 required><br><br>
                <label for="email">Email ID</label><br>
                <input type="email" id="email" name="email"required><br><br>
                <label for="mobile">Mobile Number</label><br>
                <input type="number" id="mobile" name="mobile" pattern="[0-9]{10,10}"><br><br>
                <label for="experience">Years of Experience</label><br>
                <input type="number" id="experience" name="experience" min=0 max=30 step=1><br><br>
                <label for="role">Job Role</label><br>
                <select id="role" name="role">
                    <option>Software Engineer</option>
                    <option>Web Developer</option>
                    <option>Machine Learning Engineer</option>
                    <option>Data Scientist</option>
                    <option>Cybersecurity Analyst</option>
                    <option>Cloud Engineer</option>
                    <option>Mobile App Developer</option>
                </select><br><br>
                <label for="skill">Technical Skills</label><br>
                <input type="radio" name="skill" value="C">C
                <input type="radio" name="skill" value="C++">C++
                <input type="radio" name="skill" value="Python">Python
                <input type="radio" name="skill" value="Java">Java
                <input type="radio" name="skill" value="DSA">DSA<br><br>
                <label for="coverLetter">Cover Letter:</label><br><br>
                <textarea id="coverLetter" name="coverLetter"rows="8" cols="50" placeholder="Write your cover letter here..."></textarea><br><br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </fieldset>
        </form>
    </body>
</html>
